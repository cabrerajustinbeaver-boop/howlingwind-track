<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typhoon Sound</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0ala0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: sans-serif; color: white;
    }
    #btn {
      font-size: 1.5rem; 
      padding: 2rem 3rem; 
      border-radius: 12px; 
      border: 2px solid #4af; 
      background: transparent;
      color: #4af;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn:hover { background: #4af; color: #000; } 
    #timer { margin-top: 1.5rem; font-size: 1.1rem; color: #aaa; }
    #bar-wrap {
      margin-top: 1rem;
      width: 300px; height: 6px;
      background: #222; border-radius: 3px;
    }
    #bar {
      height: 100%; width: 0%;
      background: #4af; border-radius: 3px;
      transition: width 1s linear;
    }
  </style>
</head>
<body>
  
  <button id="btn"» Click to Start Typhoon</button>
  <div id="timer">0:00:00 / 7:03:00</div> 
  <div id="bar-wrap"><div id="bar"></div></div>
    
<audio id="audio" 1oop>
  <source src="sound.mp3" type="audio/mpeg">
</audio> 
    
<script>
  const TOTAL = 7 * 3600 + 3 * 60; // 7h 3min in seconds
  const audio = document.getElementById('audio');
  const btn = document. getElementById('btn');
  const timer = document.getElementById('timer');
  const bar = document.getElementById('bar');
  
  audio.volume = 1.0; // Max volume
  
  let elapsed = 0;
  let interval = null;
  let running = false;

  function fmt (s) {
    const h = Math. floor (s / 3600);
    const m = Math. floor( (s % 3600) / 60);
    const sec = s % 60;
    return ${h}:${String(m).padstart(2,'0')}:${String(sec) .padstart(2, '0')}*;
  }
  
  function tick() {
    elapsed++;
    timer. textContent = '${fmt(elapsed)} / 7:03:00 ;
    bar.style.width = Math.min((elapsed /TOTAL) * 100,100) + 1%';
    if (elapsed >= TOTAL) {
      audio. pause();
      audio. currentTime = 0;
      clearInterval (interval);
      btn. textContent = '• Done - Click to Restart';
      elapsed = 0; running = false;
    }
  }
  
  btn. addEventListener('click', () => {
    if (!running) {
      audio. play();
      interval = setInterval(tick, 1000);
      btn. textContent = ' ⏸️ Pause';
      running = true;
    } else {
      audio.pause();
      clearInterval (interval);
      btn. textContent = '• Resume';
      running = false;
    }
  }) ;
  </script>
</body>
</html>
