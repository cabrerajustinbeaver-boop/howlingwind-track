<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typhoon Sound</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: sans-serif; color: white;
    }
    #btn {
      font-size: 1.5rem; 
      padding: 2rem 3rem; 
      border-radius: 12px; 
      border: 2px solid #4af; 
      background: transparent;
      color: #4af;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn:hover { background: #4af; color: #000; } 
    #timer { margin-top: 1.5rem; font-size: 1.1rem; color: #aaa; }
    #bar-wrap {
      margin-top: 1rem;
      width: 300px; height: 6px;
      background: #222; border-radius: 3px;
    }
    #bar {
      height: 100%; width: 0%;
      background: #4af; border-radius: 3px;
      transition: width 1s linear;
    }
  </style>
</head>
<body>
  
  <button id="btn"» Click to Start Typhoon</button>
  <div id="timer">0:00:00 / 7:03:00</div> 
  <div id="bar-wrap"><div id="bar"></div></div>
    
<audio id="audio" src="./sound.mp3" loop preload="auto"></audio>
    
<script>
  
  const TOTAL = 7 * 3600 + 3 * 60;

  const audio = document.getElementById('audio');
  const btn = document.getElementById('btn');
  const timer = document.getElementById('timer');
  const bar = document.getElementById('bar');

  audio.volume = 1.0;

  let elapsed = 0;
  let interval = null;
  let running = false;
  let starting = false;

  function fmt(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;

    return String(h).padStart(2, '0') + ':' +
           String(m).padStart(2, '0') + ':' +
           String(sec).padStart(2, '0');
  }

  function tick() {
    elapsed++;

    timer.textContent = fmt(elapsed) + ' / 07:03:00';
    bar.style.width = Math.min((elapsed / TOTAL) * 100, 100) + '%';

    if (elapsed >= TOTAL) {
      clearInterval(interval);
      interval = null;
      audio.pause();
      audio.currentTime = 0;
      elapsed = 0;
      running = false;
      btn.textContent = '▶ Start Typhoon Again';
    }
  }

  btn.addEventListener('click', async () => {
    if (starting) return;

    if (!running) {
      starting = true;
      btn.disabled = true;

      try {
        await audio.play();
        running = true;
        interval = setInterval(tick, 1000);
        btn.textContent = '⏸ Pause';
      } catch (error) {
        console.error('Audio playback failed:', error);btn.textContent = '▶ Retry Playing Typhoon';
        alert('Audio could not start. Please try again.');
      } finally {
        starting = false;
        btn.disabled = false;
      }
    } else {
      audio.pause();
      clearInterval(interval);
      interval = null;
      running = false;
      btn.textContent = '▶ Resume';
    }
  });
  </script>
</body>
</html>
